<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Correcting RAG</title>
    <!-- Logo ile aynı işaret: atıf parantezi + doğrulama tiki; sekme temasına göre renk değişir -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E.b%7Bstroke:%231c1b19%7D.c%7Bstroke:%231d6b58%7D@media (prefers-color-scheme:dark)%7B.b%7Bstroke:%23ebeae6%7D.c%7Bstroke:%235dbb9b%7D%7D%3C/style%3E%3Cpath class='b' d='M10 5H6v18h4M18 5h4v18h-4'/%3E%3Cpath class='c' d='M10.5 14.5l2.75 2.75L18 11.5'/%3E%3C/svg%3E">
    <!-- Kayıtlı tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler) -->
    <script>
        try {
            const savedTheme = localStorage.getItem('scr.theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
        } catch (_) { /* depolama kapalı: sistem teması kullanılır */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Marked.js for Markdown parsing + DOMPurify for sanitizing its HTML output.
         Sürümler sabit ve SRI ile doğrulanıyor; güncellerken hash'leri de yenileyin. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
        integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
        integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
        crossorigin="anonymous"></script>
    <!-- MathJax: sayfa açılışında tüm belgeyi taramaz, yalnızca cevaplar dizilir -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['\\[', '\\]'], ['$$', '$$']]
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                typeset: false,
                ready() {
                    MathJax.startup.defaultReady();
                    MathJax.startup.promise.then(() => {
                        if (window.typesetMath) window.typesetMath(document.querySelectorAll('.answer'));
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
        integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei"
        crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #f6f5f2;
            --surface: #ffffff;
            --surface-sunk: #efeee9;
            --hover: rgba(28, 27, 25, 0.05);
            --selected: rgba(28, 27, 25, 0.08);
            --border: #e2e0da;
            --border-strong: #cdcac2;

            --text: #1c1b19;
            --text-2: #57554f;
            --text-3: #706d66;

            --accent: #1d6b58;
            --accent-hover: #175747;
            --on-accent: #ffffff;
            --accent-soft: #e2efe9;
            --accent-text: #155040;

            --ok: #2c7a4b;
            --warn: #93580a;
            --danger: #b23a30;
            --danger-soft: #fae7e4;

            --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --font-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            --font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;

            --radius: 8px;
            --sidebar-w: 264px;
            --sources-w: 380px;
            --content-w: 740px;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #171715;
                --surface: #1f1f1c;
                --surface-sunk: #1b1b19;
                --hover: rgba(235, 234, 230, 0.06);
                --selected: rgba(235, 234, 230, 0.1);
                --border: #2f2e2b;
                --border-strong: #46443f;
                --text: #ebeae6;
                --text-2: #b3b1aa;
                --text-3: #8f8d86;
                --accent: #5dbb9b;
                --accent-hover: #74c9ab;
                --on-accent: #0f2b22;
                --accent-soft: #1c362d;
                --accent-text: #8fd6bb;
                --ok: #72c495;
                --warn: #e3ac52;
                --danger: #ef8a80;
                --danger-soft: #3b201d;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #171715;
            --surface: #1f1f1c;
            --surface-sunk: #1b1b19;
            --hover: rgba(235, 234, 230, 0.06);
            --selected: rgba(235, 234, 230, 0.1);
            --border: #2f2e2b;
            --border-strong: #46443f;
            --text: #ebeae6;
            --text-2: #b3b1aa;
            --text-3: #8f8d86;
            --accent: #5dbb9b;
            --accent-hover: #74c9ab;
            --on-accent: #0f2b22;
            --accent-soft: #1c362d;
            --accent-text: #8fd6bb;
            --ok: #72c495;
            --warn: #e3ac52;
            --danger: #ef8a80;
            --danger-soft: #3b201d;
            color-scheme: dark;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .icon {
            flex: none;
            display: block;
        }

        summary {
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        /* Yerleşim: belgeler + sohbetler | sohbet akışı | kaynaklar */
        .app {
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--sources-w);
            height: 100vh;
            height: 100dvh;
        }

        /* Ortak kontroller */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            font-size: 14px;
            font-weight: 500;
        }

        .btn:hover {
            border-color: var(--text-3);
        }

        .btn:disabled {
            cursor: progress;
            color: var(--text-3);
        }

        .btn-quiet {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 8px;
            border: 0;
            border-radius: 6px;
            background: none;
            color: var(--text-2);
            font-size: 13px;
        }

        .btn-quiet:hover {
            background: var(--hover);
            color: var(--text);
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: inline-grid;
            place-items: center;
            flex: none;
            border: 0;
            border-radius: 6px;
            background: none;
            color: var(--text-2);
        }

        .icon-btn:hover {
            background: var(--hover);
            color: var(--text);
        }

        .show-below-wide,
        .show-narrow {
            display: none;
        }

        .spinner {
            width: 14px;
            height: 14px;
            flex: none;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Sol panel */
        .sidebar {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 12px;
            background: var(--surface-sunk);
            border-right: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 6px 16px;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            flex: none;
            color: var(--text);
        }

        .brand-text {
            flex: 1;
            min-width: 0;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-3);
        }

        .new-chat {
            width: 100%;
        }

        .side-section {
            margin-top: 22px;
        }

        .side-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 6px;
            margin-bottom: 4px;
        }

        .side-head h2 {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
        }

        .count {
            font-size: 12px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        .doc-filter {
            width: 100%;
            height: 30px;
            margin: 2px 0 6px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-size: 13px;
        }

        .doc-list,
        .chat-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 6px;
            font-size: 13px;
            color: var(--text-2);
        }

        .doc-item .icon {
            color: var(--text-3);
        }

        .doc-item span,
        .chat-item {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list-note {
            padding: 5px 6px;
            font-size: 13px;
            color: var(--text-3);
        }

        .link-btn {
            border: 0;
            background: none;
            padding: 4px 6px;
            font-size: 12px;
            color: var(--accent-text);
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        .upload {
            display: grid;
            justify-items: start;
            gap: 6px;
            margin-top: 8px;
            padding: 10px;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
        }

        .upload.is-drop {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-3);
        }

        .upload-status {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 6px;
            padding: 0 6px;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .upload-status:empty {
            display: none;
        }

        .upload-status.is-busy {
            color: var(--text-2);
        }

        .upload-status.is-ok {
            color: var(--ok);
        }

        .upload-status.is-error {
            color: var(--danger);
        }

        .chat-row {
            display: flex;
            align-items: center;
            border-radius: 6px;
        }

        .chat-row:hover,
        .chat-row.is-active {
            background: var(--selected);
        }

        .chat-item {
            flex: 1;
            min-width: 0;
            padding: 6px;
            border: 0;
            background: none;
            text-align: left;
            font-size: 13px;
            color: var(--text-2);
        }

        .chat-row.is-active .chat-item {
            color: var(--text);
        }

        .chat-del {
            width: 28px;
            height: 28px;
            opacity: 0;
        }

        .chat-row:hover .chat-del,
        .chat-del:focus-visible {
            opacity: 1;
        }

        @media (hover: none) {
            .chat-del {
                opacity: 1;
            }
        }

        .side-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: auto;
            padding: 16px 0 0 6px;
        }

        .health {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-3);
        }

        .health .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .health.is-ok .dot {
            background: var(--ok);
        }

        .health.is-down {
            color: var(--danger);
        }

        .health.is-down .dot {
            background: var(--danger);
        }

        /* Sohbet alanı */
        .chat {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            min-width: 0;
            min-height: 0;
        }

        .chat-top {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 52px;
            padding: 8px 16px 8px 20px;
            border-bottom: 1px solid var(--border);
        }

        .chat-title {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .thread {
            overflow-y: auto;
            padding: 28px 20px 12px;
        }

        .empty {
            max-width: var(--content-w);
            margin: 6vh auto 0;
        }

        .empty h2 {
            margin: 0 0 10px;
            font-family: var(--font-read);
            font-size: 30px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .empty p {
            max-width: 56ch;
            margin: 0 0 8px;
            color: var(--text-2);
        }

        .empty-docs {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .examples {
            margin-top: 32px;
        }

        .examples h3 {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
        }

        .examples ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--border);
        }

        .example {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 4px;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: none;
            text-align: left;
        }

        .example-text {
            flex: 1;
        }

        .example-topic {
            font-size: 12px;
            color: var(--text-3);
        }

        .example .icon {
            color: var(--text-3);
        }

        .example:hover .example-text {
            color: var(--accent-text);
        }

        .turn {
            max-width: var(--content-w);
            margin: 0 auto 40px;
            scroll-margin-top: 16px;
        }

        .question {
            width: fit-content;
            max-width: 85%;
            margin-left: auto;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 14px 14px 4px 14px;
            background: var(--surface);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .reply {
            margin-top: 18px;
        }

        .progress {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-2);
        }

        .elapsed {
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        .progress-note {
            flex-basis: 100%;
            margin: 0;
            padding-left: 24px;
            font-size: 13px;
            color: var(--text-3);
        }

        .reply-error {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--danger);
            border-radius: var(--radius);
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 14px;
        }

        .reply-error.is-neutral {
            border-color: var(--border-strong);
            background: none;
            color: var(--text-2);
        }

        .reply-error p {
            margin: 0;
        }

        /* Cevap metni */
        .answer {
            font-family: var(--font-read);
            font-size: 17px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .answer p,
        .answer ul,
        .answer ol,
        .answer blockquote,
        .answer pre,
        .answer table {
            margin: 0 0 0.8em;
        }

        .answer> :last-child {
            margin-bottom: 0;
        }

        .answer ul,
        .answer ol {
            padding-left: 1.4em;
        }

        .answer li {
            margin: 0.2em 0;
        }

        .answer h1,
        .answer h2,
        .answer h3,
        .answer h4 {
            margin: 1.2em 0 0.5em;
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 600;
        }

        .answer code {
            padding: 0.05em 0.3em;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface-sunk);
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        .answer pre {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunk);
            overflow-x: auto;
            font-size: 14px;
        }

        .answer pre code {
            padding: 0;
            border: 0;
            background: none;
        }

        .answer blockquote {
            padding-left: 12px;
            border-left: 3px solid var(--border-strong);
            color: var(--text-2);
        }

        .answer table {
            display: block;
            overflow-x: auto;
            border-collapse: collapse;
            font-family: var(--font-ui);
            font-size: 14px;
        }

        .answer th,
        .answer td {
            padding: 6px 10px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .answer mjx-container {
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
        }

        .cite {
            display: inline-grid;
            place-items: center;
            min-width: 19px;
            height: 19px;
            margin: 0 1px;
            padding: 0 5px;
            border: 1px solid var(--border-strong);
            border-radius: 5px;
            background: var(--surface);
            color: var(--text-2);
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            vertical-align: 2px;
            font-variant-numeric: tabular-nums;
        }

        .cite:hover {
            border-color: var(--accent);
            color: var(--accent-text);
        }

        .cite.is-active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-text);
        }

        /* Doğrulama durumu (QueryResponse.status) */
        .answer-status {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 10px;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-2);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            align-self: center;
            font-weight: 600;
            color: var(--tone);
        }

        .tone-success {
            --tone: var(--ok);
        }

        .tone-warning {
            --tone: var(--warn);
        }

        .tone-error {
            --tone: var(--danger);
        }

        .tone-neutral {
            --tone: var(--text-2);
        }

        .trace {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-2);
        }

        .trace>summary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: -6px;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .trace>summary:hover {
            background: var(--hover);
            color: var(--text);
        }

        .chev {
            transition: transform 0.15s ease;
        }

        details[open]>summary .chev {
            transform: rotate(90deg);
        }

        .claims {
            list-style: none;
            margin: 8px 0 0;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .claim+.claim {
            border-top: 1px solid var(--border);
        }

        .claim-supported {
            --tone: var(--ok);
        }

        .claim-unknown {
            --tone: var(--warn);
        }

        .claim-refuted {
            --tone: var(--danger);
        }

        .claim>details>summary {
            display: grid;
            grid-template-columns: 16px minmax(0, 1fr) auto;
            align-items: start;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text);
        }

        .claim>details>summary:hover {
            background: var(--hover);
        }

        .claim .icon {
            margin-top: 3px;
            color: var(--tone);
        }

        .claim-state {
            font-size: 12px;
            color: var(--tone);
            white-space: nowrap;
        }

        .claim-body {
            display: grid;
            gap: 8px;
            padding: 0 12px 12px 38px;
        }

        .claim-reason {
            margin: 0;
            font-size: 13px;
            color: var(--text-2);
        }

        .claim-basis {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-3);
        }

        .extra-evidence>summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--text-3);
        }

        .extra-evidence>summary:hover {
            color: var(--text);
        }

        .extra-evidence blockquote {
            display: -webkit-box;
            margin: 6px 0 0;
            padding: 2px 10px;
            border-left: 2px solid var(--border-strong);
            font-size: 13px;
            color: var(--text-2);
            overflow: hidden;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .reply-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin: 6px 0 0 -8px;
        }

        /* Soru kutusu */
        .composer {
            padding: 8px 20px 16px;
        }

        .composer-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: var(--content-w);
            margin: 0 auto;
            padding: 8px 8px 8px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            background: var(--surface);
        }

        .composer-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            max-height: 200px;
            padding: 6px 0;
            border: 0;
            outline: 0;
            background: none;
            resize: none;
            font-size: 15px;
            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: var(--text-3);
        }

        .send-btn {
            width: 34px;
            height: 34px;
            flex: none;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: var(--on-accent);
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn.is-stop {
            background: var(--text);
            color: var(--bg);
        }

        .composer-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            max-width: var(--content-w);
            margin: 6px auto 0;
            font-size: 12px;
            color: var(--text-3);
        }

        .composer-meta .is-error {
            color: var(--danger);
        }

        .char-count {
            font-variant-numeric: tabular-nums;
        }

        /* Kaynak paneli */
        .sources {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-left: 1px solid var(--border);
            background: var(--surface);
        }

        .sources-head {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 52px;
            padding: 8px 12px 8px 18px;
            border-bottom: 1px solid var(--border);
        }

        .sources-head h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
        }

        .sources-meta {
            flex: 1;
            font-size: 12px;
            color: var(--text-3);
        }

        .sources-body {
            display: grid;
            align-content: start;
            gap: 18px;
            overflow-y: auto;
            padding: 14px 14px 24px;
        }

        .sources-empty {
            margin: 0;
            padding: 12px 4px;
            font-size: 14px;
            color: var(--text-3);
        }

        .sources-group h3,
        .more-sources>summary {
            margin: 0 0 6px 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
        }

        .more-sources>summary {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .more-sources>summary:hover {
            color: var(--text);
        }

        .source {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            scroll-margin: 12px;
        }

        .source+.source {
            margin-top: 8px;
        }

        .source.is-focused {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .source>summary {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 2px 8px;
            padding: 10px 12px;
            cursor: pointer;
        }

        .source-n {
            grid-row: span 2;
            display: grid;
            place-items: center;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface);
            font-size: 12px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .source.is-focused .source-n {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent-text);
        }

        .source-name {
            align-self: center;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .source-preview {
            display: -webkit-box;
            font-size: 13px;
            color: var(--text-2);
            overflow: hidden;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .source[open] .source-preview {
            display: none;
        }

        .source-text {
            margin: 0;
            padding: 0 12px 12px;
            font-family: var(--font-read);
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .source-claims {
            padding: 10px 12px 12px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        .source-claims p {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
        }

        .source-claims ul {
            display: grid;
            gap: 6px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .source-claims li {
            display: flex;
            gap: 8px;
        }

        .source-claims .icon {
            margin-top: 2px;
            color: var(--tone);
        }

        .scrim {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Dar ekranlar: kaynaklar ve sol panel çekmece olur */
        @media (max-width: 1199px) {
            .app {
                grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            }

            .sources {
                position: fixed;
                inset: 0 0 0 auto;
                z-index: 30;
                width: min(420px, 92vw);
                transform: translateX(100%);
                visibility: hidden;
                transition: transform 0.2s ease, visibility 0s linear 0.2s;
            }

            body[data-drawer="sources"] .sources {
                transform: none;
                visibility: visible;
                transition: transform 0.2s ease;
            }

            .show-below-wide {
                display: inline-flex;
            }
        }

        @media (max-width: 859px) {
            .app {
                grid-template-columns: minmax(0, 1fr);
            }

            .sidebar {
                position: fixed;
                inset: 0 auto 0 0;
                z-index: 30;
                width: min(300px, 86vw);
                transform: translateX(-100%);
                visibility: hidden;
                transition: transform 0.2s ease, visibility 0s linear 0.2s;
            }

            body[data-drawer="sidebar"] .sidebar {
                transform: none;
                visibility: visible;
                transition: transform 0.2s ease;
            }

            .show-narrow {
                display: inline-grid;
            }

            .chat-top {
                padding-left: 8px;
            }

            .thread {
                padding: 20px 16px 8px;
            }

            .composer {
                padding: 6px 12px 12px;
            }

            .empty h2 {
                font-size: 24px;
            }

            .composer-hint {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                scroll-behavior: auto !important;
            }

            .spinner {
                animation-duration: 2s;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Sol panel: belgeler ve sohbet geçmişi -->
        <aside class="sidebar" id="sidebar" aria-label="Belgeler ve sohbetler">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 28 28" fill="none" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 5H6v18h4M18 5h4v18h-4" stroke="currentColor" />
                    <path d="M10.5 14.5l2.75 2.75L18 11.5" stroke="var(--accent)" />
                </svg>
                <div class="brand-text">
                    <div class="brand-name">Self-Correcting RAG</div>
                    <div class="brand-sub">Kaynaklı, doğrulanmış cevaplar</div>
                </div>
                <button class="icon-btn show-narrow" data-action="close-drawer" data-icon="x"
                    aria-label="Menüyü kapat"></button>
            </div>

            <button class="btn new-chat" id="new-chat-btn" data-icon="plus">Yeni sohbet</button>

            <section class="side-section" id="docs-section" aria-labelledby="docs-heading">
                <div class="side-head">
                    <h2 id="docs-heading">Belgeler</h2>
                    <span class="count" id="doc-count"></span>
                </div>
                <label class="sr-only" for="doc-filter">Belgelerde ara</label>
                <input type="search" class="doc-filter" id="doc-filter" placeholder="Belgelerde ara" hidden>
                <ul class="doc-list" id="doc-list"></ul>
                <button class="link-btn" id="doc-more" hidden></button>
                <div class="upload" id="upload-zone">
                    <button class="btn" id="add-doc-btn" data-icon="upload">Belge ekle</button>
                    <span class="upload-hint">PDF veya TXT, en fazla 20 MB. Buraya sürükleyip de bırakabilirsiniz.</span>
                    <input type="file" id="file-upload" accept=".pdf,.txt" hidden>
                </div>
                <div class="upload-status" id="upload-status" role="status" aria-live="polite"></div>
            </section>

            <section class="side-section" aria-labelledby="chats-heading">
                <div class="side-head">
                    <h2 id="chats-heading">Sohbetler</h2>
                </div>
                <ul class="chat-list" id="chat-list"></ul>
            </section>

            <div class="side-foot">
                <span class="health" id="health">
                    <span class="dot" aria-hidden="true"></span>
                    <span id="health-text">Sunucu kontrol ediliyor…</span>
                </span>
                <button class="icon-btn" id="theme-btn" aria-label="Koyu temaya geç"></button>
            </div>
        </aside>

        <!-- Orta: sohbet akışı -->
        <main class="chat">
            <header class="chat-top">
                <button class="icon-btn show-narrow" data-action="open-sidebar" data-icon="menu"
                    aria-label="Menüyü aç"></button>
                <h1 class="chat-title" id="chat-title">Yeni sohbet</h1>
                <button class="btn-quiet show-below-wide" id="open-sources-btn" data-action="open-sources"
                    data-icon="book" hidden>Kaynaklar</button>
            </header>

            <div class="thread" id="thread"></div>

            <form class="composer" id="composer" novalidate>
                <div class="composer-box">
                    <label class="sr-only" for="query-input">Soru</label>
                    <textarea id="query-input" rows="1" maxlength="1000"
                        placeholder="Belgelerinize bir soru sorun"></textarea>
                    <button type="submit" class="send-btn" id="submit-btn" aria-label="Gönder"></button>
                </div>
                <div class="composer-meta">
                    <span id="composer-note" class="composer-hint">Enter gönderir, Shift+Enter yeni satır. Her soru
                        bağımsız yanıtlanır.</span>
                    <span class="char-count" id="char-count"></span>
                </div>
            </form>
        </main>

        <!-- Sağ: seçili cevabın kaynak pasajları -->
        <aside class="sources" id="sources-panel" aria-labelledby="sources-heading">
            <header class="sources-head">
                <h2 id="sources-heading">Kaynaklar</h2>
                <span class="sources-meta" id="sources-meta"></span>
                <button class="icon-btn show-below-wide" data-action="close-drawer" data-icon="x"
                    aria-label="Kaynakları kapat"></button>
            </header>
            <div class="sources-body" id="sources-body"></div>
        </aside>

        <div class="scrim" id="scrim" data-action="close-drawer" hidden></div>
    </div>

    <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

    <template id="empty-template">
        <section class="empty">
            <h2>Belgelerinize soru sorun</h2>
            <p>Cevaplar yalnızca yüklediğiniz belgelerden yazılır. Her iddia kaynaklarla tek tek kontrol edilir;
                kaynaklarla çelişen bir iddia cevapta yer almaz.</p>
            <div class="empty-docs">
                <p id="empty-docs-text"></p>
                <button class="btn" data-action="add-doc" data-icon="upload" hidden>Belge ekle</button>
            </div>
            <div class="examples">
                <h3>Örnek sorular</h3>
                <ul>
                    <li><button class="example" data-question="What is the main proposal of Bitcoin to prevent double-spending?"
                            data-icon-end="arrow-right"><span class="example-text">How does Bitcoin prevent
                                double-spending without a trusted third party?</span><span
                                class="example-topic">Bitcoin</span></button></li>
                    <li><button class="example" data-question="How does LoRA reduce the number of trainable parameters during fine-tuning?"
                            data-icon-end="arrow-right"><span class="example-text">How does LoRA reduce the number of
                                trainable parameters?</span><span class="example-topic">LoRA</span></button></li>
                    <li><button class="example" data-question="What is the formula of Scaled Dot-Product Attention in Transformers?"
                            data-icon-end="arrow-right"><span class="example-text">What is the formula of scaled
                                dot-product attention?</span><span class="example-topic">Transformer</span></button>
                    </li>
                    <li><button class="example" data-question="What is the target global warming limit in Celsius in the IPCC report?"
                            data-icon-end="arrow-right"><span class="example-text">What global warming limit does the
                                IPCC report target?</span><span class="example-topic">IPCC</span></button></li>
                </ul>
            </div>
        </section>
    </template>

    <script>
        const MAX_UPLOAD_MB = 20;
        const ALLOWED_UPLOAD_EXTENSIONS = ['.pdf', '.txt'];
        const MIN_QUESTION_LENGTH = 3;
        const MAX_QUESTION_LENGTH = 1000;
        const STORAGE_KEY = 'scr.chats.v1';
        const THEME_KEY = 'scr.theme';
        const MAX_SAVED_CHATS = 30;
        const DOC_PREVIEW_COUNT = 8;
        const WIDE_QUERY = window.matchMedia('(min-width: 1200px)');

        // Sunucudan / LLM'den gelen metin innerHTML'e asla ham olarak yazılmaz.
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderMarkdown(text) {
            return DOMPurify.sanitize(marked.parse(text || ''));
        }

        // FastAPI hata gövdesinden okunabilir mesaj çıkarır (HTTPException veya 422 doğrulama hatası).
        async function readErrorMessage(response, fallback) {
            try {
                const body = await response.json();
                if (typeof body.detail === 'string') return body.detail;
                if (Array.isArray(body.detail) && body.detail.length > 0) {
                    return body.detail.map(d => d.msg).join(', ');
                }
            } catch (_) { /* JSON olmayan gövde */ }
            return fallback;
        }

        // İkonlar sabit SVG'lerdir; kullanıcı/sunucu verisi içermez.
        const ICONS = {
            plus: '<path d="M12 5v14M5 12h14"/>',
            menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
            x: '<path d="M6 6l12 12M18 6L6 18"/>',
            file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
            upload: '<path d="M12 15V4M7 9l5-5 5 5"/><path d="M5 20h14"/>',
            'arrow-up': '<path d="M12 19V5M6 11l6-6 6 6"/>',
            'arrow-right': '<path d="M5 12h14M13 6l6 6-6 6"/>',
            stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
            copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
            check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
            help: '<circle cx="12" cy="12" r="9"/><path d="M12 17v.01M9.7 9.6a2.4 2.4 0 1 1 3.3 2.2c-.6.3-1 .8-1 1.5v.4"/>',
            'x-circle': '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
            minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
            book: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
            chevron: '<path d="M9 6l6 6-6 6"/>',
            refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
            moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
        };

        function icon(name, size = 16, extraClass = '') {
            return `<svg class="icon ${extraClass}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
        }

        function applyIcons(root) {
            root.querySelectorAll('[data-icon]').forEach(node => node.insertAdjacentHTML('afterbegin', icon(node.dataset.icon)));
            root.querySelectorAll('[data-icon-end]').forEach(node => node.insertAdjacentHTML('beforeend', icon(node.dataset.iconEnd)));
        }

        function el(id) {
            return document.getElementById(id);
        }

        function formatDuration(ms) {
            const seconds = Math.max(0, Math.round(ms / 1000));
            return seconds < 60 ? `${seconds} sn` : `${Math.floor(seconds / 60)} dk ${seconds % 60} sn`;
        }

        function announce(text) {
            el('announcer').textContent = text;
        }

        // ---- Durum ve tarayıcı depolaması (okunamazsa uygulama yine çalışır) ----

        const state = {
            chats: [],
            activeId: null,          // null → henüz soru sorulmamış yeni sohbet
            running: null,           // { chatId, index, controller, started, timer }
            sourceView: null,        // { chatId, turnIndex, focusN }
            files: [],
            filesLoaded: false,
            showAllDocs: false,
            uploading: false
        };

        function loadChats() {
            try {
                const chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(chats) ? chats.filter(c => c && Array.isArray(c.turns)) : [];
            } catch (_) {
                return [];
            }
        }

        function saveChats() {
            const chats = state.chats
                .filter(c => c.turns.length > 0)
                .sort((a, b) => b.updatedAt - a.updatedAt)
                .slice(0, MAX_SAVED_CHATS);
            // Kota dolarsa en eski sohbetler bırakılarak tekrar denenir.
            for (let n = chats.length; n >= 0; n--) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats.slice(0, n)));
                    return;
                } catch (_) { /* kota dolu veya depolama kapalı */ }
            }
        }

        function newId() {
            return window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
        }

        function activeChat() {
            return state.chats.find(c => c.id === state.activeId) || null;
        }

        function makeTitle(question) {
            const oneLine = question.replace(/\s+/g, ' ').trim();
            return oneLine.length > 60 ? `${oneLine.slice(0, 57)}…` : oneLine;
        }

        function latestAnsweredTurn(chat) {
            if (!chat) return -1;
            for (let i = chat.turns.length - 1; i >= 0; i--) {
                if (chat.turns[i].state === 'done') return i;
            }
            return -1;
        }

        // ---- Tema ----

        function currentTheme() {
            return document.documentElement.dataset.theme
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function updateThemeButton() {
            const dark = currentTheme() === 'dark';
            const button = el('theme-btn');
            button.innerHTML = icon(dark ? 'sun' : 'moon');
            button.setAttribute('aria-label', dark ? 'Açık temaya geç' : 'Koyu temaya geç');
        }

        function toggleTheme() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem(THEME_KEY, next); } catch (_) { /* depolama kapalı */ }
            updateThemeButton();
        }

        // ---- Çekmeceler (dar ekranlarda sol panel ve kaynaklar) ----

        function openDrawer(name) {
            document.body.dataset.drawer = name;
            el('scrim').hidden = false;
            const panel = name === 'sidebar' ? el('sidebar') : el('sources-panel');
            const closeBtn = panel.querySelector('[data-action="close-drawer"]');
            if (closeBtn) closeBtn.focus();
        }

        function closeDrawer() {
            if (!document.body.dataset.drawer) return;
            delete document.body.dataset.drawer;
            el('scrim').hidden = true;
        }

        // ---- Sağlık durumu: yalnızca sunucunun yanıt verip vermediğini gösterir ----

        async function checkHealth() {
            let ok = false;
            try {
                const response = await fetch('/health', { cache: 'no-store' });
                ok = response.ok;
            } catch (_) { /* sunucuya ulaşılamadı */ }
            el('health').className = `health ${ok ? 'is-ok' : 'is-down'}`;
            el('health-text').textContent = ok ? 'Sunucu çalışıyor' : 'Sunucuya ulaşılamıyor';
        }

        // ---- Belgeler ----

        async function fetchUploadedFiles() {
            try {
                const res = await fetch('/files');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                state.files = data.files || [];
                state.filesLoaded = true;
            } catch (err) {
                console.error('Dosya listesi alınamadı:', err);
            }
            renderDocs();
            renderEmptyDocs();
        }

        function renderDocs() {
            const list = el('doc-list');
            const filterInput = el('doc-filter');
            const moreBtn = el('doc-more');
            const query = filterInput.value.trim().toLocaleLowerCase('tr');

            el('doc-count').textContent = state.filesLoaded ? state.files.length : '';
            filterInput.hidden = state.files.length <= DOC_PREVIEW_COUNT;

            const matches = query
                ? state.files.filter(name => name.toLocaleLowerCase('tr').includes(query))
                : state.files;
            const collapsible = !query && matches.length > DOC_PREVIEW_COUNT;
            const shown = collapsible && !state.showAllDocs ? matches.slice(0, DOC_PREVIEW_COUNT) : matches;

            list.innerHTML = '';
            shown.forEach(name => {
                const item = document.createElement('li');
                item.className = 'doc-item';
                item.title = name;
                item.innerHTML = `${icon('file', 14)}<span>${escapeHtml(name)}</span>`;
                list.appendChild(item);
            });

            if (!state.filesLoaded) {
                list.innerHTML = '<li class="list-note">Belgeler yüklenemedi.</li>';
            } else if (state.files.length === 0) {
                list.innerHTML = '<li class="list-note">Henüz belge yok.</li>';
            } else if (matches.length === 0) {
                list.innerHTML = '<li class="list-note">Eşleşen belge yok.</li>';
            }

            moreBtn.hidden = !collapsible;
            moreBtn.textContent = state.showAllDocs ? 'Daha az göster' : `Tümünü göster (${matches.length})`;
        }

        function validateFile(file) {
            const name = file.name.toLowerCase();
            if (!ALLOWED_UPLOAD_EXTENSIONS.some(ext => name.endsWith(ext))) {
                return 'Yalnızca PDF ve TXT dosyaları eklenebilir.';
            }
            if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
                return `Dosya ${MAX_UPLOAD_MB} MB sınırını aşıyor.`;
            }
            if (file.size === 0) return 'Dosya boş.';
            return null;
        }

        let uploadStatusTimer = null;

        function setUploadStatus(kind, text) {
            const status = el('upload-status');
            clearTimeout(uploadStatusTimer);
            status.className = `upload-status is-${kind}`;
            status.innerHTML = kind === 'busy' ? '<span class="spinner"></span>' : '';
            status.appendChild(document.createTextNode(text));
            if (kind === 'ok') {
                uploadStatusTimer = setTimeout(() => { status.textContent = ''; }, 6000);
            }
        }

        async function uploadFile(file) {
            if (!file || state.uploading) return;
            const problem = validateFile(file);
            if (problem) {
                setUploadStatus('error', problem);
                return;
            }

            const addBtn = el('add-doc-btn');
            state.uploading = true;
            addBtn.disabled = true;
            setUploadStatus('busy', `${file.name} ekleniyor. Büyük PDF'lerde bu bir dakika sürebilir.`);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) {
                    throw new Error(await readErrorMessage(response, 'Dosya eklenemedi.'));
                }
                const result = await response.json();
                if (result.status !== 'success') {
                    throw new Error(result.error || result.message || 'Dosya eklenemedi.');
                }
                setUploadStatus('ok', `${file.name} eklendi.`);
                await fetchUploadedFiles();
            } catch (err) {
                setUploadStatus('error', err instanceof TypeError ? 'Sunucuya ulaşılamadı.' : err.message);
            } finally {
                state.uploading = false;
                addBtn.disabled = false;
                el('file-upload').value = '';
            }
        }

        // ---- Sohbet listesi ----

        function renderChatList() {
            const list = el('chat-list');
            list.innerHTML = '';
            const chats = state.chats
                .filter(c => c.turns.length > 0)
                .sort((a, b) => b.updatedAt - a.updatedAt);

            if (chats.length === 0) {
                list.innerHTML = '<li class="list-note">Henüz sohbet yok.</li>';
                return;
            }

            chats.forEach(chat => {
                const row = document.createElement('li');
                row.className = `chat-row${chat.id === state.activeId ? ' is-active' : ''}`;

                const open = document.createElement('button');
                open.className = 'chat-item';
                open.dataset.action = 'open-chat';
                open.dataset.chatId = chat.id;
                open.textContent = chat.title || 'Adsız sohbet';
                open.title = chat.title || '';
                if (chat.id === state.activeId) open.setAttribute('aria-current', 'page');

                const del = document.createElement('button');
                del.className = 'icon-btn chat-del';
                del.dataset.action = 'delete-chat';
                del.dataset.chatId = chat.id;
                del.setAttribute('aria-label', `“${chat.title}” sohbetini sil`);
                del.innerHTML = icon('x', 14);
                del.hidden = state.running && state.running.chatId === chat.id;

                row.append(open, del);
                list.appendChild(row);
            });
        }

        function openChat(chatId) {
            state.activeId = chatId;
            const chat = activeChat();
            const latest = latestAnsweredTurn(chat);
            state.sourceView = latest >= 0 ? { chatId, turnIndex: latest, focusN: null } : null;
            renderAll();
            closeDrawer();
            const thread = el('thread');
            thread.scrollTop = thread.scrollHeight;
        }

        function startNewChat() {
            state.activeId = null;
            state.sourceView = null;
            renderAll();
            closeDrawer();
            el('query-input').focus();
        }

        function deleteChat(chatId) {
            if (state.running && state.running.chatId === chatId) return;
            state.chats = state.chats.filter(c => c.id !== chatId);
            if (state.activeId === chatId) {
                state.activeId = null;
                state.sourceView = null;
            }
            saveChats();
            renderAll();
        }

        // ---- Sohbet akışı ----

        function renderAll() {
            renderChatList();
            renderThread();
            renderSources();
        }

        function renderThread() {
            const chat = activeChat();
            const thread = el('thread');
            thread.innerHTML = '';
            el('chat-title').textContent = chat ? chat.title : 'Yeni sohbet';

            if (!chat || chat.turns.length === 0) {
                const empty = el('empty-template').content.cloneNode(true);
                applyIcons(empty);
                thread.appendChild(empty);
                renderEmptyDocs();
                return;
            }

            chat.turns.forEach((turn, index) => thread.appendChild(buildTurn(chat, index)));
            typesetMath(thread.querySelectorAll('.answer'));
        }

        function renderEmptyDocs() {
            const text = el('empty-docs-text');
            if (!text) return;
            const addBtn = text.parentElement.querySelector('[data-action="add-doc"]');
            if (!state.filesLoaded) {
                text.textContent = '';
                addBtn.hidden = true;
            } else if (state.files.length === 0) {
                text.textContent = 'Henüz belge yüklenmedi. Soru sormadan önce bir PDF veya TXT ekleyin.';
                addBtn.hidden = false;
            } else {
                text.textContent = `${state.files.length} belge yüklü.`;
                addBtn.hidden = true;
            }
        }

        function buildTurn(chat, index) {
            const turn = chat.turns[index];
            const article = document.createElement('article');
            article.className = 'turn';
            article.dataset.turn = index;

            const question = document.createElement('div');
            question.className = 'question';
            question.textContent = turn.question;
            article.appendChild(question);

            const reply = document.createElement('div');
            reply.className = 'reply';
            if (turn.state === 'pending') {
                reply.appendChild(buildProgress());
            } else if (turn.state === 'error') {
                reply.appendChild(buildError(turn, index));
            } else {
                buildAnswer(reply, turn, index);
            }
            article.appendChild(reply);
            return article;
        }

        function buildProgress() {
            const progress = document.createElement('div');
            progress.className = 'progress';
            progress.setAttribute('role', 'status');
            const elapsed = state.running ? performance.now() - state.running.started : 0;
            progress.innerHTML = `
                <span class="spinner" aria-hidden="true"></span>
                <span>Kaynaklar aranıyor, cevap yazılıyor ve iddialar doğrulanıyor</span>
                <span class="elapsed">${formatDuration(elapsed)}</span>
                <button type="button" class="btn-quiet" data-action="stop">${icon('stop', 14)}Durdur</button>
                <p class="progress-note" hidden>Doğrulanamayan iddialar olursa soru yeniden aranır; bu biraz daha sürebilir.</p>
            `;
            return progress;
        }

        function updateElapsed() {
            if (!state.running) return;
            const elapsed = performance.now() - state.running.started;
            document.querySelectorAll('.progress .elapsed').forEach(node => {
                node.textContent = formatDuration(elapsed);
            });
            if (elapsed > 20000) {
                document.querySelectorAll('.progress-note').forEach(node => { node.hidden = false; });
            }
        }

        function buildError(turn, index) {
            const box = document.createElement('div');
            box.className = `reply-error${turn.aborted ? ' is-neutral' : ''}`;
            if (!turn.aborted) box.setAttribute('role', 'alert');
            const message = document.createElement('p');
            message.textContent = turn.error || 'Cevap alınamadı.';
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'btn';
            retry.dataset.action = 'retry';
            retry.dataset.turn = index;
            retry.innerHTML = `${icon('refresh', 14)}Tekrar dene`;
            box.append(message, retry);
            return box;
        }

        function buildAnswer(reply, turn, index) {
            const data = turn.response;
            const sources = data.sources || [];

            const answer = document.createElement('div');
            answer.className = 'answer';
            answer.innerHTML = renderMarkdown(data.answer);
            linkCitations(answer, index, sources.length);
            reply.appendChild(answer);

            reply.appendChild(renderAnswerStatus(data.status, data.attempts));
            reply.appendChild(buildTrace(data, index, turn.elapsedMs));

            const actions = document.createElement('div');
            actions.className = 'reply-actions';
            actions.innerHTML = `
                <button type="button" class="btn-quiet" data-action="copy" data-turn="${index}">${icon('copy', 14)}<span>Kopyala</span></button>
                ${sources.length ? `<button type="button" class="btn-quiet" data-action="show-sources" data-turn="${index}">${icon('book', 14)}Kaynaklar (${sources.length})</button>` : ''}
            `;
            reply.appendChild(actions);
        }

        // QueryResponse.status → kullanıcıya gösterilen doğrulama durumu
        const ANSWER_STATUS = {
            verified: {
                tone: 'success',
                icon: 'check',
                label: 'Doğrulandı',
                desc: 'Cevaptaki iddialar kaynaklarla doğrulandı.'
            },
            repaired: {
                tone: 'success',
                icon: 'check',
                label: 'Onarıldı ve doğrulandı',
                desc: 'Desteklenmeyen iddialar çıkarıldı; kalan cevap yeniden doğrulandı.'
            },
            partially_verified: {
                tone: 'warning',
                icon: 'help',
                label: 'Kısmen doğrulandı',
                desc: 'Kaynaklarla çelişen iddia yok, ancak bazı iddialar kaynaklarda bulunamadı.'
            },
            unverified: {
                tone: 'error',
                icon: 'help',
                label: 'Doğrulanmadı',
                desc: 'Cevaptan iddia çıkarılamadığı için doğrulama yapılamadı. Kaynaklarla kontrol edin.'
            },
            no_answer: {
                tone: 'neutral',
                icon: 'minus',
                label: 'Güvenilir cevap bulunamadı',
                desc: 'Yüklenen belgelerde bu soruya güvenilir bir cevap yok.'
            }
        };

        function renderAnswerStatus(status, attempts) {
            const info = ANSWER_STATUS[status] || {
                tone: 'neutral',
                icon: 'minus',
                label: 'Durum bilinmiyor',
                desc: 'Cevabın doğrulama durumu alınamadı.'
            };
            const box = document.createElement('div');
            box.className = `answer-status tone-${info.tone}`;

            const badge = document.createElement('span');
            badge.className = 'status-badge';
            badge.innerHTML = icon(info.icon, 14);
            badge.appendChild(document.createTextNode(info.label));

            const desc = document.createElement('span');
            desc.textContent = Number.isInteger(attempts) && attempts > 1
                ? `${info.desc} ${attempts} denemede üretildi.`
                : info.desc;

            box.append(badge, desc);
            return box;
        }

        const CLAIM_STATUS = {
            supported: { label: 'Doğrulandı', icon: 'check' },
            unknown: { label: 'Kaynakta bulunamadı', icon: 'help' },
            refuted: { label: 'Kaynakla çelişiyor', icon: 'x-circle' }
        };

        function buildTrace(data, turnIndex, elapsedMs) {
            const sources = data.sources || [];
            const v = data.verification;
            const verifications = (v && v.verifications) || [];

            const parts = [];
            if (verifications.length) {
                parts.push(`${verifications.length} iddia kontrol edildi`);
                if (v.unknown_counts) parts.push(`${v.unknown_counts} kaynakta bulunamadı`);
                if (v.refuted_counts) parts.push(`${v.refuted_counts} çelişkili`);
            } else {
                parts.push('İddia doğrulaması yok');
            }
            parts.push(`${sources.length} pasaj`);
            if (elapsedMs) parts.push(formatDuration(elapsedMs));

            if (!verifications.length) {
                const line = document.createElement('div');
                line.className = 'trace';
                line.textContent = parts.join(' · ');
                return line;
            }

            const details = document.createElement('details');
            details.className = 'trace';
            const summary = document.createElement('summary');
            summary.innerHTML = icon('chevron', 14, 'chev');
            summary.appendChild(document.createTextNode(parts.join(' · ')));
            details.appendChild(summary);

            const list = document.createElement('ol');
            list.className = 'claims';
            verifications.forEach(item => list.appendChild(buildClaim(item, sources, turnIndex)));
            details.appendChild(list);
            return details;
        }

        function buildClaim(item, sources, turnIndex) {
            const meta = CLAIM_STATUS[item.status] || CLAIM_STATUS.unknown;
            const li = document.createElement('li');
            li.className = `claim claim-${CLAIM_STATUS[item.status] ? item.status : 'unknown'}`;

            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.innerHTML = icon(meta.icon, 14);
            const text = document.createElement('span');
            text.textContent = item.claim;
            const stateLabel = document.createElement('span');
            stateLabel.className = 'claim-state';
            stateLabel.textContent = meta.label;
            summary.append(text, stateLabel);
            details.appendChild(summary);

            const body = document.createElement('div');
            body.className = 'claim-body';
            if (item.reasoning) {
                const reason = document.createElement('p');
                reason.className = 'claim-reason';
                reason.textContent = item.reasoning;
                body.appendChild(reason);
            }

            // Kanıtlar chunk içeriğinin aynısıdır; cevabın kaynaklarındaysa numarasıyla bağlanır.
            const cited = [];
            const extra = [];
            (item.evidence || []).forEach(evidence => {
                const n = sources.findIndex(src => src.content === evidence) + 1;
                if (n > 0) cited.push(n); else extra.push(evidence);
            });

            if (cited.length) {
                const basis = document.createElement('div');
                basis.className = 'claim-basis';
                basis.appendChild(document.createTextNode('Kanıt:'));
                [...new Set(cited)].sort((a, b) => a - b).forEach(n => basis.appendChild(citeButton(turnIndex, n)));
                body.appendChild(basis);
            }
            if (extra.length) {
                const more = document.createElement('details');
                more.className = 'extra-evidence';
                const moreSummary = document.createElement('summary');
                moreSummary.textContent = `Ek kanıt pasajları (${extra.length})`;
                more.appendChild(moreSummary);
                extra.forEach(evidence => {
                    const quote = document.createElement('blockquote');
                    quote.textContent = evidence;
                    more.appendChild(quote);
                });
                body.appendChild(more);
            }
            if (!cited.length && !extra.length) {
                const none = document.createElement('p');
                none.className = 'claim-reason';
                none.textContent = 'Kanıt bulunamadı.';
                body.appendChild(none);
            }

            details.appendChild(body);
            li.appendChild(details);
            return li;
        }

        // ---- Atıflar: [N] → sources[N-1] ----

        const CITATION_RE = /\[(\d+(?:\s*[,;–-]\s*\d+)*)\]/g;

        function parseCitation(group) {
            const numbers = [];
            group.split(/\s*[,;]\s*/).forEach(part => {
                const range = part.split(/\s*[–-]\s*/).map(Number);
                if (range.length === 2 && range[1] >= range[0] && range[1] - range[0] < 20) {
                    for (let n = range[0]; n <= range[1]; n++) numbers.push(n);
                } else {
                    range.forEach(n => numbers.push(n));
                }
            });
            return [...new Set(numbers)];
        }

        function citedNumbers(answerText, count) {
            const numbers = new Set();
            for (const match of String(answerText || '').matchAll(CITATION_RE)) {
                parseCitation(match[1]).forEach(n => { if (n >= 1 && n <= count) numbers.add(n); });
            }
            return numbers;
        }

        function citeButton(turnIndex, n) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'cite';
            button.dataset.action = 'cite';
            button.dataset.turn = turnIndex;
            button.dataset.n = n;
            button.textContent = n;
            button.setAttribute('aria-label', `Kaynak ${n}`);
            return button;
        }

        function linkCitations(root, turnIndex, count) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode: node => node.parentElement.closest('code, pre, a')
                    ? NodeFilter.FILTER_REJECT
                    : NodeFilter.FILTER_ACCEPT
            });
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);

            nodes.forEach(node => {
                const text = node.nodeValue;
                const fragment = document.createDocumentFragment();
                let last = 0;
                for (const match of text.matchAll(CITATION_RE)) {
                    const numbers = parseCitation(match[1]).filter(n => n >= 1 && n <= count);
                    if (!numbers.length) continue;
                    fragment.append(text.slice(last, match.index));
                    numbers.forEach(n => fragment.append(citeButton(turnIndex, n)));
                    last = match.index + match[0].length;
                }
                if (last === 0) return;
                fragment.append(text.slice(last));
                node.replaceWith(fragment);
            });
        }

        function typesetMath(elements) {
            const targets = [...elements];
            if (!targets.length || !window.MathJax || !MathJax.typesetPromise) return;
            MathJax.typesetPromise(targets).catch(err => console.warn(err.message));
        }

        // ---- Kaynak paneli ----

        function showSources(turnIndex, focusN) {
            state.sourceView = { chatId: state.activeId, turnIndex, focusN: focusN ?? null };
            renderSources();
            if (!WIDE_QUERY.matches) openDrawer('sources');
        }

        function renderSources() {
            const body = el('sources-body');
            const meta = el('sources-meta');
            const chat = activeChat();
            const view = state.sourceView;
            const turn = chat && view && view.chatId === chat.id ? chat.turns[view.turnIndex] : null;
            const data = turn && turn.state === 'done' ? turn.response : null;

            body.innerHTML = '';
            el('open-sources-btn').hidden = !data;
            document.querySelectorAll('.cite.is-active').forEach(node => node.classList.remove('is-active'));

            if (!data) {
                meta.textContent = '';
                const hint = document.createElement('p');
                hint.className = 'sources-empty';
                hint.textContent = 'Bir cevaptaki numaralı atıfa tıklayın; dayandığı pasaj burada açılır.';
                body.appendChild(hint);
                return;
            }

            const sources = data.sources || [];
            meta.textContent = `${view.turnIndex + 1}. soru · ${sources.length} pasaj`;
            if (!sources.length) {
                const none = document.createElement('p');
                none.className = 'sources-empty';
                none.textContent = 'Bu cevap için pasaj getirilmedi.';
                body.appendChild(none);
                return;
            }

            if (view.focusN) {
                document.querySelectorAll(`.turn[data-turn="${view.turnIndex}"] .cite[data-n="${view.focusN}"]`)
                    .forEach(node => node.classList.add('is-active'));
            }

            const cited = citedNumbers(data.answer, sources.length);
            const citedList = sources.map((_, i) => i + 1).filter(n => cited.has(n));
            const otherList = sources.map((_, i) => i + 1).filter(n => !cited.has(n));

            if (citedList.length) {
                const group = document.createElement('section');
                group.className = 'sources-group';
                const heading = document.createElement('h3');
                heading.textContent = 'Cevapta atıf yapılanlar';
                group.appendChild(heading);
                citedList.forEach(n => group.appendChild(buildSourceItem(data, n, view.focusN === n)));
                body.appendChild(group);
            }

            if (otherList.length) {
                const group = document.createElement('details');
                group.className = 'more-sources';
                group.open = !citedList.length || otherList.includes(view.focusN);
                const summary = document.createElement('summary');
                summary.innerHTML = icon('chevron', 12, 'chev');
                summary.appendChild(document.createTextNode(
                    citedList.length ? `Getirilen diğer pasajlar (${otherList.length})` : `Getirilen pasajlar (${otherList.length})`
                ));
                group.appendChild(summary);
                otherList.forEach(n => group.appendChild(buildSourceItem(data, n, view.focusN === n)));
                body.appendChild(group);
            }

            if (view.focusN) {
                const focused = el(`source-${view.focusN}`);
                if (focused) requestAnimationFrame(() => focused.scrollIntoView({ block: 'nearest' }));
            } else {
                body.scrollTop = 0;
            }
        }

        function buildSourceItem(data, n, focused) {
            const src = data.sources[n - 1];
            const item = document.createElement('details');
            item.className = `source${focused ? ' is-focused' : ''}`;
            item.id = `source-${n}`;
            item.open = focused;

            const summary = document.createElement('summary');
            const number = document.createElement('span');
            number.className = 'source-n';
            number.textContent = n;
            const name = document.createElement('span');
            name.className = 'source-name';
            name.textContent = src.source || 'Bilinmeyen belge';
            name.title = src.source || '';
            const preview = document.createElement('span');
            preview.className = 'source-preview';
            preview.textContent = src.content;
            summary.append(number, name, preview);
            item.appendChild(summary);

            const text = document.createElement('p');
            text.className = 'source-text';
            text.textContent = src.content;
            item.appendChild(text);

            const verifications = (data.verification && data.verification.verifications) || [];
            const dependent = verifications.filter(v => (v.evidence || []).includes(src.content));
            if (dependent.length) {
                const box = document.createElement('div');
                box.className = 'source-claims';
                const heading = document.createElement('p');
                heading.textContent = 'Bu pasajı kanıt olarak kullanan iddialar';
                const list = document.createElement('ul');
                dependent.forEach(v => {
                    const meta = CLAIM_STATUS[v.status] || CLAIM_STATUS.unknown;
                    const li = document.createElement('li');
                    li.className = `claim-${CLAIM_STATUS[v.status] ? v.status : 'unknown'}`;
                    li.innerHTML = icon(meta.icon, 14);
                    const claimText = document.createElement('span');
                    claimText.textContent = v.claim;
                    li.appendChild(claimText);
                    li.title = meta.label;
                    list.appendChild(li);
                });
                box.append(heading, list);
                item.appendChild(box);
            }
            return item;
        }

        // ---- Soru gönderme ----

        function setComposerBusy(busy) {
            const button = el('submit-btn');
            button.classList.toggle('is-stop', busy);
            button.innerHTML = icon(busy ? 'stop' : 'arrow-up', 18);
            button.setAttribute('aria-label', busy ? 'Durdur' : 'Gönder');
        }

        function setComposerNote(text, isError) {
            const note = el('composer-note');
            note.textContent = text || 'Enter gönderir, Shift+Enter yeni satır. Her soru bağımsız yanıtlanır.';
            note.classList.toggle('is-error', Boolean(isError));
            note.classList.toggle('composer-hint', !isError);
        }

        function autosizeInput() {
            const input = el('query-input');
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
            const length = input.value.length;
            el('char-count').textContent = length > MAX_QUESTION_LENGTH * 0.8 ? `${length} / ${MAX_QUESTION_LENGTH}` : '';
        }

        async function ask(rawQuestion) {
            const question = rawQuestion.trim();
            if (state.running) return;
            if (question.length < MIN_QUESTION_LENGTH) {
                setComposerNote(`Soru en az ${MIN_QUESTION_LENGTH} karakter olmalı.`, true);
                el('query-input').focus();
                return;
            }

            let chat = activeChat();
            if (!chat) {
                chat = { id: newId(), title: makeTitle(question), updatedAt: Date.now(), turns: [] };
                state.chats.push(chat);
                state.activeId = chat.id;
            }
            chat.turns.push({ question, state: 'pending' });

            const input = el('query-input');
            input.value = '';
            autosizeInput();
            setComposerNote();
            await runTurn(chat, chat.turns.length - 1);
        }

        async function runTurn(chat, index) {
            const turn = chat.turns[index];
            turn.state = 'pending';
            delete turn.error;
            delete turn.aborted;
            delete turn.response;
