            const controller = new AbortController();
            state.running = { chatId: chat.id, index, controller, started: performance.now() };
            state.running.timer = setInterval(updateElapsed, 1000);
            chat.updatedAt = Date.now();
            saveChats();
            renderChatList();
            if (state.activeId === chat.id) {
                renderThread();
                scrollToTurn(index);
            }
            setComposerBusy(true);

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: turn.question }),
                    signal: controller.signal
                });
                if (!response.ok) {
                    throw new Error(await readErrorMessage(response, 'Sunucu isteği tamamlayamadı.'));
                }
                turn.response = await response.json();
                turn.state = 'done';
            } catch (err) {
                turn.state = 'error';
                if (err.name === 'AbortError') {
                    turn.aborted = true;
                    turn.error = 'Durduruldu.';
                } else if (err instanceof TypeError) {
                    turn.error = 'Sunucuya ulaşılamadı. Bağlantıyı kontrol edip tekrar deneyin.';
                } else {
                    turn.error = err.message || 'Cevap alınamadı.';
                }
            } finally {
                turn.elapsedMs = Math.round(performance.now() - state.running.started);
                clearInterval(state.running.timer);
                state.running = null;
                setComposerBusy(false);
                chat.updatedAt = Date.now();
                saveChats();
                renderChatList();
                if (state.activeId === chat.id) {
                    if (turn.state === 'done') state.sourceView = { chatId: chat.id, turnIndex: index, focusN: null };
                    renderThread();
                    renderSources();
                    scrollToTurn(index);
                }
                announce(turn.state === 'done' ? 'Cevap hazır.' : turn.error);
            }
        }

        function scrollToTurn(index) {
            const target = el('thread').querySelector(`.turn[data-turn="${index}"]`);
            if (target) target.scrollIntoView({ block: 'start' });
        }

        async function copyAnswer(index, button) {
            const chat = activeChat();
            const turn = chat && chat.turns[index];
            if (!turn || !turn.response) return;
            const label = button.querySelector('span');
            try {
                await navigator.clipboard.writeText(turn.response.answer);
                label.textContent = 'Kopyalandı';
            } catch (_) {
                label.textContent = 'Kopyalanamadı';
            }
            setTimeout(() => { label.textContent = 'Kopyala'; }, 2000);
        }

        // ---- Olaylar ----

        function handleClick(event) {
            const target = event.target.closest('[data-action], [data-question]');
            if (!target) return;

            if (target.dataset.question) {
                ask(target.dataset.question);
                return;
            }

            const index = Number(target.dataset.turn);
            switch (target.dataset.action) {
                case 'cite':
                    showSources(index, Number(target.dataset.n));
                    break;
                case 'show-sources':
                    showSources(index, null);
                    break;
                case 'open-sources':
                    openDrawer('sources');
                    break;
                case 'copy':
                    copyAnswer(index, target);
                    break;
                case 'retry': {
                    const chat = activeChat();
                    if (chat && !state.running) runTurn(chat, index);
                    break;
                }
                case 'stop':
                    if (state.running) state.running.controller.abort();
                    break;
                case 'open-chat':
                    openChat(target.dataset.chatId);
                    break;
                case 'delete-chat':
                    deleteChat(target.dataset.chatId);
                    break;
                case 'add-doc':
                    el('file-upload').click();
                    break;
                case 'open-sidebar':
                    openDrawer('sidebar');
                    break;
                case 'close-drawer':
                    closeDrawer();
                    break;
            }
        }

        function bindUploadDrop() {
            const zone = el('docs-section');
            const uploadZone = el('upload-zone');
            zone.addEventListener('dragover', event => {
                event.preventDefault();
                uploadZone.classList.add('is-drop');
            });
            zone.addEventListener('dragleave', event => {
                if (!zone.contains(event.relatedTarget)) uploadZone.classList.remove('is-drop');
            });
            zone.addEventListener('drop', event => {
                event.preventDefault();
                uploadZone.classList.remove('is-drop');
                uploadFile(event.dataTransfer.files[0]);
            });
            // Bölge dışına bırakılan dosya tarayıcıda açılıp sayfadan çıkmasın
            window.addEventListener('dragover', event => event.preventDefault());
            window.addEventListener('drop', event => event.preventDefault());
        }

        function init() {
            applyIcons(document);
            updateThemeButton();
            setComposerBusy(false);

            state.chats = loadChats();
            // Sayfa yenilenirken yarıda kalan sorular hata olarak işaretlenir.
            state.chats.forEach(chat => chat.turns.forEach(turn => {
                if (turn.state === 'pending') {
                    turn.state = 'error';
                    turn.error = 'Sayfa yenilendiği için bu soru yarıda kaldı.';
                }
            }));

            document.addEventListener('click', handleClick);
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') closeDrawer();
            });

            el('composer').addEventListener('submit', event => {
                event.preventDefault();
                if (state.running) state.running.controller.abort();
                else ask(el('query-input').value);
            });
            el('query-input').addEventListener('keydown', event => {
                if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
                    event.preventDefault();
                    el('composer').requestSubmit();
                }
            });
            el('query-input').addEventListener('input', () => {
                autosizeInput();
                setComposerNote();
            });

            el('new-chat-btn').addEventListener('click', startNewChat);
            el('theme-btn').addEventListener('click', toggleTheme);
            el('add-doc-btn').addEventListener('click', () => el('file-upload').click());
            el('file-upload').addEventListener('change', event => uploadFile(event.target.files[0]));
            el('doc-filter').addEventListener('input', renderDocs);
            el('doc-more').addEventListener('click', () => {
                state.showAllDocs = !state.showAllDocs;
                renderDocs();
            });
            bindUploadDrop();

            WIDE_QUERY.addEventListener('change', event => {
                if (event.matches && document.body.dataset.drawer === 'sources') closeDrawer();
            });

            renderAll();
            renderDocs();
            fetchUploadedFiles();
            checkHealth();
            setInterval(checkHealth, 30000);
            el('query-input').focus();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
